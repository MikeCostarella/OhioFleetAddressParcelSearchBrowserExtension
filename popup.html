<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ohio Parcel Finder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="" width="24" height="24">
    <h1>Ohio Parcel Finder</h1>
  </header>
  <form id="form" autocomplete="off">
    <label for="address">Street address in Ohio</label>
    <div class="row">
      <input id="address" type="search" placeholder="4761 Waterloo Rd, Atwater, OH 44201" maxlength="200" required>
      <button id="go" type="submit">Find</button>
    </div>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <ul id="results"></ul>
  <footer>
    Tip: select an address on any page and right-click, or type <kbd>parcel</kbd> and a space in the address bar.
    Addresses are looked up with the U.S. Census Bureau geocoder.
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
